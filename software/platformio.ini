; PlatformIO Project Configuration File

[env]
test_framework = unity

[env:az-delivery-devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
lib_deps =
    alexiii/incbin
    hmueller01/PubSubClient3
    bblanchon/ArduinoJson
    ESP32Async/ESPAsyncWebServer
    br3ttb/PID
    duinowitchery/hd44780
monitor_speed = 115200
upload_protocol = esptool
;upload_protocol = espota
;upload_port = *IP*
; Comment to deactivate serial debugging
build_flags = -DDEBUG

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I test/mocks
    -I lib/NTCSensor/src
    -I lib/StirrerConfig/src
    -I lib/StirrerControl/src
    -I lib/StirrerEncoder/src
    -I lib/StirrerDisplay/src
src_filter =
    -<src/main.cpp>
lib_ignore =
    StirrerWebserver
    StirrerWifi
    StirrerDisplay
lib_deps =
    bblanchon/ArduinoJson

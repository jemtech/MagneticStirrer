; PlatformIO Project Configuration File

[env]
test_framework = unity

[env:az-delivery-devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
lib_deps =
    alexiii/incbin
    hmueller01/PubSubClient3
    bblanchon/ArduinoJson
    ESP32Async/ESPAsyncWebServer
    br3ttb/PID
    duinowitchery/hd44780
monitor_speed = 115200
upload_protocol = esptool
;upload_protocol = espota
;upload_port = *IP*
; Comment to deactivate serial debugging
build_flags = -DDEBUG

; Host-side unit tests: `pio test -e native` (no board needed).
; Arduino, Preferences, PID and the display are replaced by the mocks in test/mocks.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -D UNITY_INCLUDE_DOUBLE
    -I test/mocks
    -I lib/NTCSensor/src
    -I lib/StirrerConfig/src
    -I lib/StirrerControl/src
    -I lib/StirrerEncoder/src
    -I lib/StirrerMenu/src
    -I lib/StirrerNaming/src
build_src_filter = -<*>
test_build_src = no
lib_ignore =
    MqttHandler
    StirrerWebserver
    StirrerWifi
    StirrerDisplay
lib_deps =
    bblanchon/ArduinoJson

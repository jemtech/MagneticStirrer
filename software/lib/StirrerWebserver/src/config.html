<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <h1>Configuration</h1>
        <a href="/index.html">← Back</a>
    </div>

    <form method="POST" action="/config.html"
          enctype="application/x-www-form-urlencoded" id="config_form">
        <div class="card">
            <div class="card-title">WiFi</div>
            <div class="form-row">
                <label for="wifiSsid">SSID</label>
                <input name="wifiSsid" id="wifiSsid" placeholder="Network name" required>
            </div>
            <div class="form-row">
                <label for="wifiPwd">Password</label>
                <input name="wifiPwd" id="wifiPwd" type="password" placeholder="Password">
            </div>
        </div>

        <div class="card">
            <div class="card-title">MQTT <span class="optional">(optional)</span></div>
            <div class="form-row">
                <label for="mqttServerIp">Server IP</label>
                <input name="mqttServerIp" id="mqttServerIp"
                       placeholder="192.168.1.100" class="ip-v4">
            </div>
            <div class="form-row">
                <label for="mqttUser">User</label>
                <input name="mqttUser" id="mqttUser" placeholder="user">
            </div>
            <div class="form-row">
                <label for="mqttPwd">Password</label>
                <input name="mqttPwd" id="mqttPwd" type="password" placeholder="Password">
            </div>
        </div>

        <div class="btn-row">
            <input type="submit" class="btn btn-primary" value="Save">
            <a href="/index.html" class="btn">Cancel</a>
        </div>
    </form>

    <script>
        function loadConfig() {
            $.ajax({
                url: '/api/config.json',
                method: 'GET',
                success: function(r) {
                    $('#wifiSsid').val(r.wifi.ssid);
                    $('#wifiPwd').val(r.wifi.password);
                    $('#mqttServerIp').val(r.mqtt.ip);
                    $('#mqttUser').val(r.mqtt.user);
                    $('#mqttPwd').val(r.mqtt.password);
                },
                error: function(xhr) { console.error('config load failed', xhr.status); }
            });
        }
        $('.ip-v4').attr({ minlength: '7', maxlength: '15' });
        loadConfig();
    </script>
</body>
</html>
